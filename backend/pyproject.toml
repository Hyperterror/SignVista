[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv", "alembic/versions"]

[tool.ruff.lint]
# Pyflakes, pycodestyle errors, bugbear, import sorting
select = ["F", "E4", "E7", "E9", "B", "I"]
ignore = [
    "B008",  # FastAPI dependencies are declared as call defaults
    "E402",  # path setup must precede some imports (tests, scripts, alembic)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml", "tests"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
